<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Vandi Load</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/admin/css/admin-theme.css" />
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="login-card animate-fade-in">
      <!-- Logo Header -->
      <div class="login-brand">
        <img src="/assets/images/logo.png" alt="Vandi Load" class="login-logo-img" />
        <h1 class="login-title">VANDI <span>LOAD</span></h1>
        <p class="login-subtitle">Admin Management Portal</p>
      </div>

      <!-- Alert Message Box -->
      <div id="loginAlert" class="alert-box" style="display: none;"></div>

      <!-- Login Form -->
      <form id="adminLoginForm" class="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email <span class="req">*</span></label>
          <div class="input-icon-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" class="form-input with-icon" placeholder="Enter your username or Gmail" required autofocus />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password <span class="req">*</span></label>
          <div class="input-icon-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="form-input with-icon" placeholder="••••••••" required />
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="login-helper-row" style="justify-content: flex-end;">
          <span style="font-size: 0.82rem; color: var(--text-muted);">Default: admin@vandiload.com / admin123</span>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block btn-lg">
          <span>Sign In to Dashboard</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="login-footer">
        <a href="../index.html" class="back-to-site-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>Back to Public Website</span>
        </a>
      </div>
    </div>
  </div>

  <script src="/admin/js/admin-auth.js"></script>
  <script>
    // Show / Hide Password Toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn?.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      }
    });

    // Check if already logged in
    if (AdminAuth.isAuthenticated()) {
      window.location.href = 'index.html';
    }

    // Handle Login Form Submit
    const loginForm = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('loginSubmitBtn');

    loginForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying credentials...</span>';

      const result = await AdminAuth.login(username, password);

      if (result.success) {
        alertBox.className = 'alert-box alert-success';
        alertBox.textContent = 'Login successful! Redirecting...';
        alertBox.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } else {
        alertBox.className = 'alert-box alert-error';
        alertBox.textContent = result.message || 'Login failed. Please check credentials.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In to Dashboard</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
      }
    });
  </script>
</body>
</html>
