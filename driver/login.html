<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Login - Vandi Load</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/admin/css/admin-theme.css" />
  <link rel="stylesheet" href="/driver/css/driver-theme.css" />
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="login-card animate-fade-in" style="max-width: 440px;">
      <!-- Logo Header -->
      <div class="login-brand">
        <img src="/assets/images/logo.png" alt="Vandi Load" class="login-logo-img" />
        <h1 class="login-title">VANDI <span>LOAD</span></h1>
        <p class="login-subtitle">Driver Partner Portal</p>
      </div>

      <!-- Info Pill -->
      <div style="background: rgba(61, 121, 80, 0.15); border: 1px solid rgba(74, 222, 128, 0.3); border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 20px; font-size: 0.85rem; color: #4ade80; display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Approved driver partners can log in to manage assigned load trips.</span>
      </div>

      <!-- Alert Message Box -->
      <div id="loginAlert" class="alert-box" style="display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.88rem;"></div>

      <!-- Login Form -->
      <form id="driverLoginForm" class="login-form">
        <div class="form-group">
          <label class="form-label" for="driverPhone">Registered Mobile Number <span class="req">*</span></label>
          <div class="input-icon-wrap" style="position: relative;">
            <svg class="input-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <input type="tel" id="driverPhone" class="form-input" style="padding-left: 42px;" placeholder="Enter your mobile number" required autofocus />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="driverPassword">Password <span class="req">*</span></label>
          <div class="input-icon-wrap" style="position: relative;">
            <svg class="input-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="driverPassword" class="form-input" style="padding-left: 42px; padding-right: 42px;" placeholder="Enter password (default: driver123)" required />
            <button type="button" id="togglePasswordBtn" class="toggle-password-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;" title="Show/Hide Password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg" style="width: 100%; margin-top: 10px;">
          <span>Login to Driver Portal</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Bottom Links -->
      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; text-align: center;">
        <a href="/index.html" style="color: var(--text-muted); text-decoration: none;">← Back to Vandi Load Website</a>
        <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.8rem;">
          <a href="/index.html#driver-register" style="color: var(--brand-gold); text-decoration: none;">Register as New Driver</a>
          <a href="/admin/login.html" style="color: var(--text-dim); text-decoration: none;">Admin Login →</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/driver/js/driver-auth.js"></script>
  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('driverPassword');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn?.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    // Form Submission
    const loginForm = document.getElementById('driverLoginForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('loginAlert');

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      alertBox.style.background = isSuccess ? 'rgba(34, 197, 94, 0.15)' : 'rgba(239, 68, 68, 0.15)';
      alertBox.style.color = isSuccess ? '#4ade80' : '#f87171';
      alertBox.style.border = isSuccess ? '1px solid rgba(34, 197, 94, 0.4)' : '1px solid rgba(239, 68, 68, 0.4)';
    }

    loginForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('driverPhone').value.trim();
      const password = document.getElementById('driverPassword').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying credentials...</span>';

      try {
        const result = await DriverAuth.login(phone, password);
        if (result.success) {
          showAlert('Login successful! Redirecting to Driver Portal...', true);
          setTimeout(() => {
            window.location.href = '/driver';
          }, 600);
        } else {
          showAlert(result.message || 'Login failed. Please verify your details.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Login to Driver Portal</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
        }
      } catch (err) {
        showAlert('Network or server error. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Login to Driver Portal</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
      }
    });

    // Auto-redirect if already logged in
    if (DriverAuth.isAuthenticated()) {
      window.location.href = '/driver';
    }
  </script>
</body>
</html>
